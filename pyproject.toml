[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ivysci-object-reader"
version = "0.1.3"
description = "Read Aliyun OSS objects through an internal CDN, public CDN, or OSS fallback."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27,<1",
    "oss2>=2.19,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
